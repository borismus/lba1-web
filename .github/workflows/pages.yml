# Builds the web build (platform/web) and publishes it to GitHub Pages: the
# page, the engine (.js, .wasm) and the loader. No game data: the player
# drops in their own copy of the game.
name: Pages

on:
  push:
    branches: [web]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.12
      - name: Build
        run: make -C platform/web
      - name: Collect the site (without the object files)
        run: |
          mkdir site
          cp -r platform/web/build/. site/
          rm -rf site/obj
          ls -la site site/vendor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
